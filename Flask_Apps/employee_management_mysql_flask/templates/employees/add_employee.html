{% extends "layout.html" %}

{% block content %}

<!-- ================================================= -->
<!-- HERO SECTION -->
<!-- ================================================= -->

<section class="hero">

    <h1>
        Add Workforce Member
    </h1>

    <p>
        Register a new employee into the enterprise
        workforce ecosystem.
    </p>

</section>

<!-- ================================================= -->
<!-- FORM CONTAINER -->
<!-- ================================================= -->

<div class="form-wrapper">

    <div class="form-card">

        <form method="POST">

            <!-- ========================================= -->
            <!-- ROW 1 -->
            <!-- ========================================= -->

            <div class="form-row">

                <div class="form-group">

                    <label>
                        Employee Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        placeholder="Enter employee name"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>
                        Age
                    </label>

                    <input
                        type="number"
                        name="age"
                        placeholder="Enter age"
                        required
                    >

                </div>

            </div>

            <!-- ========================================= -->
            <!-- ROW 2 -->
            <!-- ========================================= -->

            <div class="form-row">

                <div class="form-group">

                    <label>
                        Email Address
                    </label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>
                        Phone Number
                    </label>

                    <input
                        type="text"
                        name="phone"
                        placeholder="Enter phone number"
                        required
                    >

                </div>

            </div>

            <!-- ========================================= -->
            <!-- ROW 3 -->
            <!-- ========================================= -->

            <div class="form-row">

                <div class="form-group">

                    <label>
                        Designation
                    </label>

                    <input
                        type="text"
                        name="designation"
                        placeholder="Enter designation"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>
                        Department
                    </label>

                    <select
                        name="department_id"
                        required
                    >

                        {% for department in departments %}

                        <option value="{{ department.id }}">

                            {{ department.name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

            </div>

            <!-- ========================================= -->
            <!-- SUBMIT BUTTON -->
            <!-- ========================================= -->

            <button
                type="submit"
                class="submit-btn"
            >
                Add Employee
            </button>

        </form>

    </div>

</div>

{% endblock %}
